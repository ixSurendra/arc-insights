services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc_dev
      POSTGRES_DB: arc_insights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc_insights"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Used by the MySQL connector tests (P1-02). Same docker-compose so
  # `make infra-up` brings up everything connector tests need.
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: arc_dev
      MYSQL_DATABASE: arc_test
      MYSQL_USER: arc
      MYSQL_PASSWORD: arc_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-parc_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mysql_data:
