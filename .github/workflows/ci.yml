name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.1.34

jobs:
  # ─── Static checks ─────────────────────────────────────────────────
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check

  # ─── Unit + integration tests (with cross-tenant adversarial tests) ─
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc_dev
          POSTGRES_DB: arc_insights
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arc -d arc_insights"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: arc_dev
          MYSQL_DATABASE: arc_test
          MYSQL_USER: arc
          MYSQL_PASSWORD: arc_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -parc_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arc:arc_dev@localhost:5432/arc_insights
      MYSQL_TEST_URL: mysql://arc:arc_dev@localhost:3306/arc_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Apply initial migration (schema + RLS)
        working-directory: backend
        run: bun run db:bootstrap
      - name: Run tests (incl. cross-tenant + connector suites)
        run: bun run --filter '*' test

  # ─── Frontend build ────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build

  # ─── End-to-end (Playwright) ───────────────────────────────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [lint-typecheck, build]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: frontend
        run: bunx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─── Docker image (single-arch on PR, multi-arch on main) ──────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (PR — amd64 only, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: arc-insights:ci
      - name: Build (main — multi-arch, no push yet)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: arc-insights:ci

  # ─── Air-gapped install dry-run ────────────────────────────────────
  # Boots the built container with no network egress and verifies the
  # process starts and the /health route responds. P0-15.
  airgapped-dryrun:
    name: Air-gapped install dry-run
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: arc-insights:airgap
      - name: Boot with --network=none and verify startup
        run: |
          # Disconnected network — the container must start without reaching the
          # internet. The image is distroless (no shell, no wget), so we don't
          # exec into it; we observe the startup log from outside instead.
          docker run -d --name arc-airgap --network=none arc-insights:airgap
          # Give the process up to 30s to print its banner.
          for i in $(seq 1 30); do
            if docker logs arc-airgap 2>&1 | grep -q "Arc Insights API listening"; then
              echo "✅ Arc Insights booted with --network=none"
              docker stop arc-airgap >/dev/null
              docker rm arc-airgap >/dev/null
              exit 0
            fi
            # Bail early if the container died.
            if [ "$(docker inspect -f '{{.State.Running}}' arc-airgap 2>/dev/null)" = "false" ]; then
              echo "❌ Container exited before startup banner"
              docker logs arc-airgap || true
              docker rm arc-airgap || true
              exit 1
            fi
            sleep 1
          done
          echo "❌ Startup banner not seen within 30s"
          docker logs arc-airgap || true
          docker stop arc-airgap || true
          docker rm arc-airgap || true
          exit 1
